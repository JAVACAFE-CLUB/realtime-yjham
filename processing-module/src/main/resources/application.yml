server:
  port: 8082

spring:
  application:
    name: processing-module

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: processing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap
        # Consumer 최적화: fetch 설정
        fetch.min.bytes: 1024
        fetch.max.wait.ms: 500
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Producer 최적화: batch + compression
      batch-size: 32768
      properties:
        spring.json.add.type.headers: false
        linger.ms: 10
        compression.type: lz4
    listener:
      # Consumer 동시성: 파티션 수에 맞춤 (6개)
      concurrency: 6
      ack-mode: RECORD

ner:
  grpc:
    # 단일 호스트 모드 (기본값)
    host: ${NER_SERVICE_HOST:localhost}
    port: ${NER_SERVICE_PORT:50051}
    # 다중 호스트 모드 (로드밸런싱) - 설정 시 host/port 무시
    hosts: ${NER_SERVICE_HOSTS:}

kafka:
  topics:
    raw-news: raw-news
    raw-youtube: raw-youtube
    processed-news: processed-news
    processed-youtube: processed-youtube
    dlq-news: raw-news-dlq
    dlq-youtube: raw-youtube-dlq

processing:
  min-content-length: 100
  retry:
    max-attempts: 3
    initial-interval: 1000
    multiplier: 2.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        kafka.consumer: true
        kafka.producer: true
      slo:
        kafka.consumer.fetch.latency: 10ms, 50ms, 100ms, 500ms
        kafka.producer.request.latency: 10ms, 50ms, 100ms, 500ms
    enable:
      kafka: true
      jvm: true
      process: true

logging:
  level:
    com.yjham.processing: DEBUG
    org.springframework.kafka: INFO
