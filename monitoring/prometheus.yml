global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus 자체 모니터링
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Kafka Broker 메트릭 (JMX Exporter)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-jmx-exporter:9404']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'kafka:9092'

  # Collection Module
  - job_name: 'collection-module'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['collection-module:8081']
        labels:
          application: 'collection-module'

  # Processing Module
  - job_name: 'processing-module'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['processing-module:8082']
        labels:
          application: 'processing-module'

  # Indexing Module
  - job_name: 'indexing-module'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['indexing-module:8083']
        labels:
          application: 'indexing-module'

  # Serving Module
  - job_name: 'serving-module'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['serving-module:8080']
        labels:
          application: 'serving-module'
