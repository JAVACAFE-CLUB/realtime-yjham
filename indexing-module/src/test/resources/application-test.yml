spring:
  application:
    name: indexing-module-test

  elasticsearch:
    uris: http://localhost:9200

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    consumer:
      group-id: indexing-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

kafka:
  topics:
    processed-news: processed-news-test
    processed-youtube: processed-youtube-test
    aggregated-keywords: aggregated-keywords-test

elasticsearch:
  index:
    keywords: keywords-test
  retention-days: 7

cache:
  ttl-minutes: 5
  key-prefix: "keywords:test"

aggregation:
  top-count: 10
  cron: "0 0 0 1 1 ?"

logging:
  level:
    com.realtime.trend.indexing: DEBUG
    org.springframework.kafka: WARN
    org.testcontainers: INFO
