server:
  port: 8083

spring:
  application:
    name: indexing-module

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: indexing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

kafka:
  topics:
    processed-news: processed-news
    processed-youtube: processed-youtube
    aggregated-keywords: aggregated-keywords

elasticsearch:
  index:
    keywords: keywords
  retention-days: 30

cache:
  ttl-minutes: 10
  key-prefix: "keywords:today"

aggregation:
  top-count: 100
  cron: "0 */5 * * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        kafka.consumer: true
        kafka.producer: true
      slo:
        kafka.consumer.fetch.latency: 10ms, 50ms, 100ms, 500ms
        kafka.producer.request.latency: 10ms, 50ms, 100ms, 500ms
    enable:
      kafka: true
      jvm: true
      process: true

logging:
  level:
    com.realtime.trend.indexing: DEBUG
    org.springframework.data.elasticsearch: INFO
