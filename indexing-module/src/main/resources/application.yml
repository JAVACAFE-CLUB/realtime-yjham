spring:
  application:
    name: indexing-module

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: indexing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Kafka †= $
kafka:
  topics:
    processed-news: processed-news
    processed-youtube: processed-youtube
    aggregated-keywords: aggregated-keywords

# Elasticsearch xq§ $
elasticsearch:
  index:
    keywords: keywords
  retention-days: 30

# Redis ê‹ $
cache:
  ttl-minutes: 10
  key-prefix: "keywords:today"

# —ƒ $
aggregation:
  top-count: 100
  cron: "0 */5 * * * *"

logging:
  level:
    com.realtime.trend.indexing: DEBUG
    org.springframework.data.elasticsearch: INFO
