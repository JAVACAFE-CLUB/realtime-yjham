spring:
  application:
    name: serving-module-test

  elasticsearch:
    uris: http://localhost:9200

  data:
    redis:
      host: localhost
      port: 6379

cache:
  redis:
    ttl-minutes: 1
    key-prefix: "keywords:test"

rate-limit:
  requests-per-minute: 1000
  requests-per-hour: 10000

elasticsearch:
  index:
    keywords: keywords-test

logging:
  level:
    com.realtime.trend.serving: DEBUG
    org.testcontainers: INFO
