spring:
  application:
    name: collection-module

  # DataSource 설정 (Spring Batch Job 메타데이터용)
  datasource:
    url: jdbc:h2:mem:batch
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # MongoDB 설정
  data:
    mongodb:
      host: localhost
      port: 27017
      database: realtime-trend

  # Kafka 설정
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

  # Batch 설정
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false  # 자동 실행 방지

# 서버 포트
server:
  port: 8081

# Actuator 설정 (Prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

# YouTube API 설정
youtube:
  api:
    key: AIzaSyC3PXjnVuoIeXk6Qd0rsnjbigX73NPDHoQ
    max-results: 50

# 로깅
logging:
  level:
    com.realtime.trend: INFO
    org.springframework.kafka: WARN
    org.springframework.data.mongodb: WARN
